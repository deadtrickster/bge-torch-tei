<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- background -->
  <rect x="0" y="0" width="200" height="200" rx="36" fill="#0d1117"/>

  <!-- embedding space: cluster of vectors (dots) with similarity lines -->
  <!-- left cluster (query) -->
  <circle cx="55" cy="95" r="5" fill="#42b3bc"/>
  <circle cx="42" cy="112" r="3.5" fill="#42b3bc" opacity="0.7"/>
  <circle cx="68" cy="112" r="3.5" fill="#42b3bc" opacity="0.7"/>
  <circle cx="55" cy="128" r="3" fill="#42b3bc" opacity="0.5"/>
  <line x1="55" y1="95" x2="42" y2="112" stroke="#42b3bc" stroke-width="1" opacity="0.3"/>
  <line x1="55" y1="95" x2="68" y2="112" stroke="#42b3bc" stroke-width="1" opacity="0.3"/>
  <line x1="42" y1="112" x2="55" y2="128" stroke="#42b3bc" stroke-width="1" opacity="0.3"/>
  <line x1="68" y1="112" x2="55" y2="128" stroke="#42b3bc" stroke-width="1" opacity="0.3"/>

  <!-- right cluster (results) -->
  <circle cx="140" cy="72" r="5" fill="#ae3a38"/>
  <circle cx="155" cy="88" r="3.5" fill="#ae3a38" opacity="0.7"/>
  <circle cx="128" cy="88" r="3.5" fill="#ae3a38" opacity="0.7"/>
  <line x1="140" y1="72" x2="155" y2="88" stroke="#ae3a38" stroke-width="1" opacity="0.3"/>
  <line x1="140" y1="72" x2="128" y2="88" stroke="#ae3a38" stroke-width="1" opacity="0.3"/>

  <circle cx="148" cy="128" r="4" fill="#5a8a6a" opacity="0.6"/>
  <circle cx="134" cy="142" r="3" fill="#5a8a6a" opacity="0.4"/>

  <!-- arrow: text -> vector -->
  <path d="M 72 100 C 95 100, 100 90, 118 84" stroke="#e6edf3" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="1 6"/>

  <!-- GPU bracket: stylized die outline -->
  <rect x="30" y="30" width="140" height="140" rx="16" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- pins top -->
  <line x1="55" y1="30" x2="55" y2="18" stroke="#30363d" stroke-width="2"/>
  <line x1="75" y1="30" x2="75" y2="18" stroke="#30363d" stroke-width="2"/>
  <line x1="95" y1="30" x2="95" y2="18" stroke="#30363d" stroke-width="2"/>
  <line x1="115" y1="30" x2="115" y2="18" stroke="#30363d" stroke-width="2"/>
  <line x1="135" y1="30" x2="135" y2="18" stroke="#30363d" stroke-width="2"/>

  <!-- pins bottom -->
  <line x1="55" y1="170" x2="55" y2="182" stroke="#30363d" stroke-width="2"/>
  <line x1="75" y1="170" x2="75" y2="182" stroke="#30363d" stroke-width="2"/>
  <line x1="95" y1="170" x2="95" y2="182" stroke="#30363d" stroke-width="2"/>
  <line x1="115" y1="170" x2="115" y2="182" stroke="#30363d" stroke-width="2"/>
  <line x1="135" y1="170" x2="135" y2="182" stroke="#30363d" stroke-width="2"/>

  <!-- pins left -->
  <line x1="30" y1="60" x2="18" y2="60" stroke="#30363d" stroke-width="2"/>
  <line x1="30" y1="85" x2="18" y2="85" stroke="#30363d" stroke-width="2"/>
  <line x1="30" y1="110" x2="18" y2="110" stroke="#30363d" stroke-width="2"/>
  <line x1="30" y1="135" x2="18" y2="135" stroke="#30363d" stroke-width="2"/>

  <!-- pins right -->
  <line x1="170" y1="60" x2="182" y2="60" stroke="#30363d" stroke-width="2"/>
  <line x1="170" y1="85" x2="182" y2="85" stroke="#30363d" stroke-width="2"/>
  <line x1="170" y1="110" x2="182" y2="110" stroke="#30363d" stroke-width="2"/>
  <line x1="170" y1="135" x2="182" y2="135" stroke="#30363d" stroke-width="2"/>
</svg>
